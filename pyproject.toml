[project]
name = "nbafigs"
version = "0.0.1"
description = "NBA shot chart generator with CLI and Python API"
authors = [{name = "Ethan Fuerst", email = "ethanfuerst@gmail.com"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["nba", "shot-chart", "basketball", "matplotlib", "visualization"]
dependencies = [
    "nba-api>=1.11",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pandas>=2.3",
    "click>=8.3",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "ruff>=0.9",
    "commitizen>=4.0",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[project.scripts]
nbafigs = "nbafigs.cli:main"

[project.urls]
Documentation = "https://tidbitstatistics.com/nbafigs/"
Homepage = "https://github.com/ethanfuerst/nba-figures"
Repository = "https://github.com/ethanfuerst/nba-figures"
Issues = "https://github.com/ethanfuerst/nba-figures/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nbafigs"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["nbafigs"]

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=nbafigs --cov-report=term-missing"

[tool.coverage.run]
source = ["nbafigs"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.1"
version_files = [
    "pyproject.toml:^version",
]
tag_format = "v$version"
update_changelog_on_bump = false
